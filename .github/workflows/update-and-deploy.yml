name: Update data & deploy app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"   # daily 01:17 UTC (06:47 Sri Lanka)
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of matches to include"
        default: "365"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[data]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dataset from ball-by-ball data
        run: python pipeline/build.py --days "${{ github.event.inputs.days || '365' }}"

      - name: Enrich (player styles from Wikipedia, YouTube highlights)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/enrich.py --max-players 700 --max-videos 90
        continue-on-error: true

      - name: Rebuild with enrichment
        run: python pipeline/build.py --days "${{ github.event.inputs.days || '365' }}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data pipeline/cache
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "[data] Refresh match data $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
